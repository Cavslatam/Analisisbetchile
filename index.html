
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AnalisisBetChile | Deportes</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f7fa;color:#182230}
header{background:white;padding:20px;border-bottom:1px solid #e5e9ef}
.container{max-width:1050px;margin:auto;padding:0 16px}
.logo{font-size:25px;font-weight:800;color:#1677df}
.logo span{color:#172b4d}
.subtitle{color:#718096;font-size:13px;margin-top:5px}
nav{display:flex;gap:10px;overflow-x:auto;padding:15px 0}
button{border:1px solid #dce3eb;background:white;color:#44546a;padding:10px 16px;border-radius:9px;font-weight:600;white-space:nowrap}
button.active{background:#1677df;color:white;border-color:#1677df}
.status{background:white;padding:13px;border-radius:10px;color:#64748b;font-size:13px;margin-bottom:15px}
.match{background:white;border:1px solid #e7ebf0;border-radius:12px;padding:16px;margin-bottom:11px}
.competition{color:#718096;font-size:12px;margin-bottom:13px}
.teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;font-weight:700}
.team:last-child{text-align:right}
.score{font-size:20px;text-align:center}
.details{display:flex;justify-content:space-between;gap:10px;margin-top:13px;padding-top:11px;border-top:1px solid #edf0f4;color:#718096;font-size:12px}
.live{color:#e04444;font-weight:bold}
.empty{text-align:center;padding:35px 15px;background:white;border-radius:12px;color:#718096}
footer{text-align:center;padding:30px;color:#94a3b8;font-size:12px}
</style>
</head>
<body>
<header>
 <div class="container">
  <div class="logo">Analisis<span>BetChile</span></div>
  <div class="subtitle">Resultados, partidos y estadísticas deportivas</div>
 </div>
</header>

<main class="container">
 <nav>
  <button class="active" data-sport="all">Todos</button>
  <button data-sport="football">Fútbol</button>
  <button data-sport="basketball">Básquetbol</button>
  <button data-sport="tennis">Tenis</button>
 </nav>
 <nav>
  <button class="active" data-state="all">Todos</button>
  <button data-state="live">En vivo</button>
  <button data-state="next">Próximos</button>
  <button data-state="done">Finalizados</button>
 </nav>

 <h2>Partidos</h2>
 <div class="status" id="connection">Conectando...</div>
 <div id="matches"></div>
 <button id="refresh">Actualizar partidos</button>
</main>

<footer>AnalisisBetChile · Información deportiva</footer>

<script src="api.js"></script>
<script>
(function(){
 let currentSport="all";
 let currentState="all";
 let data={football:[],basketball:[],tennis:[]};
 let loading=false;

 const output=document.getElementById("matches");
 const connection=document.getElementById("connection");

 function get(obj,keys){
  for(const key of keys){
   const v=obj?.[key];
   if(v!==undefined && v!==null){
    if(typeof v==="object") return v.name || v.title || v.shortName || "";
    return v;
   }
  }
  return "";
 }

 function safe(value){
  return String(value ?? "").replace(/[&<>"']/g,c=>({
   "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
 }

 function statusOf(m){
  const s=String(get(m,[
   "status","state","status_text","statusText","match_status"
  ])).toLowerCase();

  if(/live|in.?play|playing|1st half|2nd half|half|quarter|set|progress/.test(s)) return "live";
  if(/finished|full.?time|ended|complete|final/.test(s)) return "done";
  return "next";
 }

 function card(m,sport){
  const home=get(m,["home_team","homeTeam","home","team1","participant1"]);
  const away=get(m,["away_team","awayTeam","away","team2","participant2"]);
  const hs=get(m,["home_score","homeScore","scoreHome"]);
  const as=get(m,["away_score","awayScore","scoreAway"]);
  const league=get(m,["competition","league","tournament","category"]);
  const date=get(m,["time","startTime","start_time","date","datetime"]);
  const state=statusOf(m);

  let time="";
  if(date){
   const d=new Date(date);
   time=isNaN(d.getTime())?date:d.toLocaleString("es-CL",{dateStyle:"short",timeStyle:"short"});
  }

  const score=(hs!=="" || as!=="") ? `${hs} - ${as}` : "VS";
  const stateText=get(m,["status_text","statusText"]) ||
   (state==="live"?"EN VIVO":state==="done"?"FINALIZADO":"PRÓXIMO");

  return `<article class="match">
   <div class="competition">${safe(league || sport.toUpperCase())}</div>
   <div class="teams">
    <div class="team">${safe(home || "Local")}</div>
    <div class="score">${safe(score)}</div>
    <div class="team">${safe(away || "Visitante")}</div>
   </div>
   <div class="details">
    <span class="${state==="live"?"live":""}">
     ${state==="live"?"● ":""}${safe(stateText)}
    </span>
    <span>${safe(time)}</span>
   </div>
  </article>`;
 }

 function render(){
  let list=[];
  const sports=currentSport==="all"?Object.keys(data):[currentSport];

  sports.forEach(s=>{
   (data[s]||[]).forEach(m=>{
    if(currentState==="all" || function statusOf(m){
  const s = String(get(m,[
    "status","state","status_text","statusText",
    "match_status","status_code"
  ])).toLowerCase().trim();

  if(
    /live|in.?play|playing|1st half|2nd half|first half|second half|half time|quarter|period|set|en vivo/.test(s)
  ) return "live";

  if(
    /finished|full.?time|ended|complete|final|ft|finished/.test(s)
  ) return "done";

  return "next";
    }
    }
   });
  });

  const order={live:0,next:1,done:2};
  list.sort((a,b)=>order[statusOf(a.match)]-order[statusOf(b.match)]);

  output.innerHTML=list.length
   ?list.map(x=>card(x.match,x.sport)).join("")
   :'<div class="empty">No hay partidos para este filtro.</div>';
 }

 async function loadAll(){
  if(loading)return;
  loading=true;
  const refresh=document.getElementById("refresh");
  refresh.disabled=true;
  connection.textContent="Actualizando partidos...";

  try{
   const result=await window.AnalisisbetAPI.getAllMatches();
   data={
    football:Array.isArray(result.football)?result.football:[],
    basketball:Array.isArray(result.basketball)?result.basketball:[],
    tennis:Array.isArray(result.tennis)?result.tennis:[]
   };

   const total=data.football.length+data.basketball.length+data.tennis.length;
   connection.textContent=`Conexión realizada: ${total} partidos recibidos.`;
   render();
  }catch(error){
   connection.textContent="Error al cargar los partidos.";
   output.innerHTML='<div class="empty">No se pudo conectar con los datos deportivos.</div>';
  }finally{
   loading=false;
   refresh.disabled=false;
  }
 }

 document.querySelectorAll("[data-sport]").forEach(btn=>{
  btn.addEventListener("click",()=>{
   currentSport=btn.dataset.sport;
   document.querySelectorAll("[data-sport]").forEach(x=>x.classList.toggle("active",x===btn));
   render();
  });
 });

 document.querySelectorAll("[data-state]").forEach(btn=>{
  btn.addEventListener("click",()=>{
   currentState=btn.dataset.state;
   document.querySelectorAll("[data-state]").forEach(x=>x.classList.toggle("active",x===btn));
   render();
  });
 });

 document.getElementById("refresh").addEventListener("click",loadAll);
 loadAll();
 setInterval(loadAll,60000);
})();
</script>
</body>
</html>
