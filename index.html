
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AnalisisBetChile</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f6fa;color:#172033;font-family:Arial,sans-serif}
header{background:#fff;padding:20px;border-bottom:1px solid #e5eaf0}
main{max-width:950px;margin:auto;padding:18px}
.logo{font-size:25px;font-weight:800;color:#1677df}
.logo span{color:#172033}
.sub{font-size:12px;color:#8491a3;margin-top:5px}
h2{font-size:20px}
nav{display:flex;gap:8px;overflow-x:auto;padding:10px 0}
button{border:1px solid #dce3eb;background:white;border-radius:9px;padding:11px 15px;font-weight:bold;color:#46546a;white-space:nowrap}
button.active{background:#1677df;color:white;border-color:#1677df}
#info{background:white;padding:13px;border-radius:10px;margin:12px 0;color:#64748b;font-size:13px}
.match{background:white;border:1px solid #e6ebf1;border-radius:12px;padding:15px;margin-bottom:10px}
.league{font-size:12px;color:#8793a4;margin-bottom:14px}
.teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;font-weight:bold}
.teams div:last-child{text-align:right}
.score{font-size:21px}
.details{display:flex;justify-content:space-between;border-top:1px solid #edf0f4;margin-top:13px;padding-top:11px;font-size:12px;color:#8793a4}
.live{color:#e04444;font-weight:bold}
.empty{background:white;border-radius:12px;padding:30px;text-align:center;color:#718096}
footer{text-align:center;padding:25px;color:#9aa5b4;font-size:12px}
</style>
</head>
<body>
<header>
 <div class="logo">Analisis<span>BetChile</span></div>
 <div class="sub">Resultados y estadísticas deportivas</div>
</header>

<main>
 <nav id="sports">
  <button class="active" data-sport="all">Todos</button>
  <button data-sport="football">Fútbol</button>
  <button data-sport="basketball">Básquetbol</button>
  <button data-sport="tennis">Tenis</button>
 </nav>

 <nav id="states">
  <button class="active" data-state="all">Todos</button>
  <button data-state="live">🔴 En vivo</button>
  <button data-state="next">Próximos</button>
  <button data-state="done">Finalizados</button>
 </nav>

 <h2>Partidos</h2>
 <div id="info">Conectando con los servidores deportivos...</div>
 <section id="matches"></section>
 <button id="refresh">↻ Actualizar partidos</button>
</main>
<footer>ANALISISBETCHILE · DATOS DEPORTIVOS</footer>

<script>
const API="https://sportscore.com/api/widget/matches/";
const sports=["football","basketball","tennis"];
let data={football:[],basketball:[],tennis:[]};
let selectedSport="all";
let selectedState="all";

function field(o,keys){
 for(const k of keys){
  let v=o?.[k];
  if(v!==undefined&&v!==null){
   if(typeof v==="object")return v.name||v.title||v.shortName||"";
   return v;
  }
 }
 return "";
}

function clean(v){
 return String(v??"").replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}

function state(m){
 const s=String(field(m,[
 "status","state","status_text","statusText","match_status"
 ])).toLowerCase();

 if(/live|in.?play|playing|1st half|2nd half|quarter|period|en vivo/.test(s))return "live";
 if(/finished|full.?time|ended|complete|final/.test(s))return "done";
 return "next";
}

function showTime(m){
 const v=field(m,["time","startTime","start_time","date","datetime"]);
 if(!v)return "";
 const d=new Date(v);
 return isNaN(d.getTime())?v:d.toLocaleString("es-CL",{
  day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"
 });
}

function card(m,sport){
 const home=field(m,["home_team","homeTeam","home","team1","participant1"])||"Local";
 const away=field(m,["away_team","awayTeam","away","team2","participant2"])||"Visitante";
 const hs=field(m,["home_score","homeScore","scoreHome"]);
 const as=field(m,["away_score","awayScore","scoreAway"]);
 const league=field(m,["competition","league","tournament"])||sport.toUpperCase();
 const st=state(m);
 const statusText=field(m,["status_text","statusText"])||
  (st==="live"?"EN VIVO":st==="done"?"FINALIZADO":"PRÓXIMO");
 const score=(hs!==""||as!=="")?`${hs} - ${as}`:"VS";

 return `<article class="match">
 <div class="league">${clean(league)}</div>
 <div class="teams">
 <div>${clean(home)}</div>
 <div class="score">${clean(score)}</div>
 <div>${clean(away)}</div>
 </div>
 <div class="details">
 <span class="${st==="live"?"live":""}">${st==="live"?"● ":""}${clean(statusText)}</span>
 <span>${clean(showTime(m))}</span>
 </div>
 </article>`;
}


let visibleCount = 20;

function render(){
 let list=[];
 const selected=sports.filter(s=>selectedSport==="all"||s===selectedSport);

 selected.forEach(s=>{
  (data[s]||[]).forEach(m=>{
   if(selectedState==="all"||state(m)===selectedState){
    list.push({m,s});
   }
  });
 });

 list.sort((a,b)=>{
  const order={live:0,next:1,done:2};
  return order[state(a.m)]-order[state(b.m)];
 });

 const shown=list.slice(0,visibleCount);

 document.getElementById("matches").innerHTML=
  (shown.length
   ?shown.map(x=>card(x.m,x.s)).join("")
   :'<div class="empty">No hay partidos disponibles.</div>')+
  (list.length>visibleCount
   ?`<button id="more" style="width:100%;margin:12px 0">Mostrar otros 20 partidos (${list.length-visibleCount} restantes)</button>`
   :"");

 const more=document.getElementById("more");
 if(more){
  more.onclick=()=>{
   visibleCount+=20;
   render();
  };
 }
}
{
 let list=[];
 const selected=sports.filter(s=>selectedSport==="all"||s===selectedSport);

 selected.forEach(s=>{
  (data[s]||[]).forEach(m=>{
   if(selectedState==="all"||state(m)===selectedState){
    list.push({m,s});
   }
  });
 });

 list.sort((a,b)=>{
  const order={live:0,next:1,done:2};
  return order[state(a.m)]-order[state(b.m)];
 });

 document.getElementById("matches").innerHTML=list.length
  ?list.map(x=>card(x.m,x.s)).join("")
  :'<div class="empty">No hay partidos disponibles en esta categoría.</div>';
}

async function load(){
 const info=document.getElementById("info");
 const refresh=document.getElementById("refresh");
 refresh.disabled=true;
 info.textContent="Cargando fútbol, básquetbol y tenis...";

 const results=await Promise.allSettled(sports.map(async sport=>{
  const url=API+"?sport="+sport+"&limit=50&src=Analisisbetchile";
  const response=await fetch(url);
  if(!response.ok)throw new Error("Error "+response.status);
  const json=await response.json();
  return Array.isArray(json.matches)?json.matches:[];
 }));

 sports.forEach((sport,i)=>{
  data[sport]=results[i].status==="fulfilled"?results[i].value:[];
 });

 const total=sports.reduce((n,s)=>n+data[s].length,0);
 const errors=results.filter(r=>r.status==="rejected").length;

 info.textContent=errors===3
  ?"No se pudo conectar con SportScore. Intenta actualizar."
  :`${total} partidos recibidos · Fútbol: ${data.football.length} · Básquetbol: ${data.basketball.length} · Tenis: ${data.tennis.length}`;

 render();
 refresh.disabled=false;
}

document.querySelectorAll("[data-sport]").forEach(b=>{
 b.onclick=()=>{
  selectedSport=b.dataset.sport;
  document.querySelectorAll("[data-sport]").forEach(x=>x.classList.toggle("active",x===b));
  render();
 };
});

document.querySelectorAll("[data-state]").forEach(b=>{
 b.onclick=()=>{
  selectedState=b.dataset.state;
  document.querySelectorAll("[data-state]").forEach(x=>x.classList.toggle("active",x===b));
  render();
 };
});

document.getElementById("refresh").onclick=load;
load();
setInterval(load,60000);
</script>
</body>
</html>
