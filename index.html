<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analisisbetchile</title>
<style>
:root {
  --bg:#080b0a;
  --panel:#111714;
  --panel2:#18221c;
  --green:#b5f52b;
  --text:#f4f7f2;
  --muted:#89958c;
  --line:#29352d;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:Arial,sans-serif;
}
header{
  padding:22px 16px 15px;
  background:#0d130f;border-bottom:1px solid var(--line);
}
.logo{font-size:24px;font-weight:900;letter-spacing:-1px}
.logo span{color:var(--green)}
.sub{color:var(--muted);font-size:12px;margin-top:5px}
nav{
  display:flex;gap:8px;padding:14px 12px;
  overflow-x:auto;border-bottom:1px solid var(--line);
}
button{
  cursor:pointer;border:0;font-weight:bold;
}
.tab,.filter{
  padding:11px 17px;border-radius:9px;
  background:var(--panel);color:var(--muted);
  white-space:nowrap;
}
.tab.active,.filter.active{
  background:var(--green);color:#10160c;
}
main{max-width:950px;margin:auto;padding:16px}
.section-title{
  font-size:18px;font-weight:800;margin:12px 0 15px;
}
.filters{display:flex;gap:8px;overflow-x:auto;margin-bottom:18px}
.match-card{
  background:var(--panel);border:1px solid var(--line);
  border-radius:15px;padding:16px;margin-bottom:12px;
  cursor:pointer;transition:.2s;
}
.match-card:active{transform:scale(.99)}
.match-card:hover{border-color:var(--green)}
.comp{
  color:var(--muted);font-size:11px;font-weight:bold;
  text-transform:uppercase;letter-spacing:.6px;
}
.match-top{display:flex;justify-content:space-between;gap:8px}
.status{font-size:11px;color:var(--green);font-weight:bold}
.teams{
  display:grid;grid-template-columns:1fr 1fr;
  gap:12px;margin:20px 0 15px;
}
.team{text-align:center;font-weight:bold;font-size:14px}
.team-name{margin-top:8px}
.crest{
  width:48px;height:48px;border-radius:50%;
  background:var(--panel2);display:grid;place-items:center;
  margin:auto;color:var(--green);font-weight:900;font-size:19px;
}
.score{
  text-align:center;font-size:23px;font-weight:900;
  color:var(--green);margin-top:8px;
}
.card-bottom{
  border-top:1px solid var(--line);padding-top:12px;
  display:flex;justify-content:space-between;
  color:var(--muted);font-size:12px;
}
.empty{
  padding:35px 15px;text-align:center;
  color:var(--muted);background:var(--panel);border-radius:14px;
}
.panel{
  background:var(--panel);border:1px solid var(--line);
  border-radius:15px;padding:16px;margin-bottom:15px;
}
input,select,textarea{
  width:100%;padding:12px;margin:7px 0 13px;
  border:1px solid var(--line);border-radius:9px;
  background:#090e0b;color:white;font-size:14px;
}
textarea{min-height:120px;resize:vertical}
label{font-size:12px;color:var(--muted);font-weight:bold}
.primary{
  background:var(--green);color:#10160c;
  border-radius:9px;padding:13px 17px;width:100%;
  font-weight:900;margin-top:5px;
}
.secondary{
  background:var(--panel2);color:white;
  border:1px solid var(--line);border-radius:9px;
  padding:11px 14px;
}
.danger{background:#532323;color:white}
.hidden{display:none!important}
.detail-header{text-align:center;padding:20px 0}
.detail-teams{
  display:grid;grid-template-columns:1fr 1fr;gap:12px;
  margin:22px 0;
}
.detail-team{text-align:center;font-weight:bold}
.detail-team .crest{width:65px;height:65px;font-size:23px}
.detail-score{text-align:center;font-size:35px;font-weight:900;color:var(--green)}
.detail-time{text-align:center;color:var(--muted);font-size:13px;margin-top:7px}
.back{
  background:var(--panel2);color:white;padding:10px 15px;
  border-radius:9px;margin-bottom:15px;
}
.stat-table{width:100%;border-collapse:collapse;margin-top:10px}
.stat-table th,.stat-table td{
  padding:12px 8px;border-bottom:1px solid var(--line);
  text-align:center;font-size:13px;
}
.stat-table th{color:var(--muted);font-weight:normal}
.stat-table td:first-child{text-align:left;color:var(--muted)}
.detail-section{margin-top:22px}
.detail-section h3{font-size:15px}
.info-line{
  display:flex;justify-content:space-between;gap:10px;
  padding:11px 0;border-bottom:1px solid var(--line);
  font-size:13px;
}
footer{
  text-align:center;padding:25px;color:var(--muted);
  font-size:11px;
}
@media(min-width:650px){
  #matches{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .match-card{margin:0}
}
</style>
</head>
<body>

<header>
  <div class="logo">ANALISIS<span>BET</span>CHILE</div>
  <div class="sub">RESULTADOS · ESTADÍSTICAS · DEPORTES</div>
</header>

<nav>
  <button class="tab active" data-sport="Fútbol">Fútbol</button>
  <button class="tab" data-sport="Básquetbol">Básquetbol</button>
  <button class="tab" data-sport="Tenis">Tenis</button>
</nav>

<main>
  <section id="home">
    <div class="section-title">Partidos</div>
    <div class="filters">
      <button class="filter active" data-filter="Todos">Todos</button>
      <button class="filter" data-filter="Próximo">Próximos</button>
      <button class="filter" data-filter="En vivo">En vivo</button>
      <button class="filter" data-filter="Finalizado">Finalizados</button>
    </div>
    <div id="matches"></div>
  </section>

  <section id="detail" class="hidden">
    <button class="back" onclick="closeDetail()">← Volver a partidos</button>
    <div id="detailContent"></div>
  </section>

  <section id="admin" class="hidden">
    <div class="section-title">Administrar datos</div>

    <div class="panel">
      <h3>Agregar un partido</h3>
      <label>Deporte</label>
      <select id="newSport">
        <option>Fútbol</option>
        <option>Básquetbol</option>
        <option>Tenis</option>
      </select>
      <label>Equipo o jugador 1</label>
      <input id="newHome" placeholder="Nombre">
      <label>Equipo o jugador 2</label>
      <input id="newAway" placeholder="Nombre">
      <label>Competición</label>
      <input id="newCompetition" placeholder="Ej. Liga de Primera">
      <label>Hora</label>
      <input id="newTime" placeholder="Ej. 18:00">
      <label>Estado</label>
      <select id="newStatus">
        <option>Próximo</option>
        <option>En vivo</option>
        <option>Finalizado</option>
      </select>
      <button class="primary" onclick="addMatch()">GUARDAR PARTIDO</button>
    </div>

    <div class="panel">
      <h3>Cargar partidos del día</h3>
      <label>Pega aquí los datos JSON</label>
      <textarea id="jsonInput" placeholder='[{"sport":"Fútbol","home":"Equipo A","away":"Equipo B","time":"18:00","status":"Próximo","competition":"Liga","stats":{}}]'></textarea>
      <button class="primary" onclick="loadJSON()">CARGAR PARTIDOS DEL DÍA</button>
    </div>

    <div class="panel">
      <h3>Editar un partido</h3>
      <label>Selecciona el partido</label>
      <select id="editMatch" onchange="loadEditor()"></select>
      <label>Marcador</label>
      <input id="editScore" placeholder="Ej. 2 - 1">
      <label>Estado</label>
      <select id="editStatus">
        <option>Próximo</option>
        <option>En vivo</option>
        <option>Finalizado</option>
      </select>
      <label>Estadísticas del partido</label>
      <textarea id="editStats" placeholder="Posesión, remates, córners, faltas, últimos resultados, clasificación..."></textarea>
      <button class="primary" onclick="saveEditor()">GUARDAR CAMBIOS</button>
      <button class="secondary danger" style="width:100%;margin-top:12px" onclick="deleteMatch()">ELIMINAR PARTIDO SELECCIONADO</button>
    </div>

    <div class="panel">
      <h3>Respaldo de datos</h3>
      <button class="secondary" style="width:100%" onclick="exportData()">EXPORTAR PARTIDOS</button>
      <label>Importar respaldo JSON</label>
      <input type="file" id="importFile" accept=".json">
      <button class="secondary" style="width:100%" onclick="importData()">IMPORTAR RESPALDO</button>
      <p style="color:var(--muted);font-size:11px">Guarda una copia de tus partidos antes de hacer cambios importantes.</p>
    </div>
  </section>

  <div style="margin-top:25px">
    <button class="secondary" style="width:100%" onclick="toggleAdmin()">⚙ ADMINISTRAR DATOS</button>
  </div>
</main>

<footer>ANALISISBETCHILE · INFORMACIÓN DEPORTIVA</footer>

<script>
const STORAGE_KEY = "abc_deportes_v2";

let matches = [];
let currentSport = "Fútbol";
let currentFilter = "Todos";

function readSaved(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return [];
    const data = JSON.parse(raw);
    if(Array.isArray(data)) return data;
    if(data && Array.isArray(data.matches)) return data.matches;
    return [];
  }catch(e){
    return [];
  }
}

matches = readSaved().map(normalizeMatch);

function normalizeMatch(m){
  return {
    id: m.id || (Date.now().toString(36)+Math.random().toString(36).slice(2,7)),
    sport: m.sport || "Fútbol",
    home: m.home || "Equipo 1",
    away: m.away || "Equipo 2",
    time: m.time || "",
    status: m.status || "Próximo",
    score: m.score || "",
    competition: m.competition || "Sin competición",
    stats: m.stats || {},
    statsText: m.statsText || ""
  };
}

function save(){
  localStorage.setItem(STORAGE_KEY,JSON.stringify(matches));
}

function esc(value){
  return String(value ?? "").replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",
    '"':"&quot;","'":"&#39;"
  })[c]);
}

function initials(name){
  return String(name || "?").trim().slice(0,1).toUpperCase();
}

function render(){
  const list = matches.filter(m=>
    m.sport === currentSport &&
    (currentFilter === "Todos" || m.status === currentFilter)
  );

  const container=document.getElementById("matches");

  if(!list.length){
    container.innerHTML='<div class="empty">No hay partidos en esta categoría.</div>';
    return;
  }

  container.innerHTML=list.map(m=>`
    <article class="match-card" onclick="openDetail('${m.id}')">
      <div class="match-top">
        <span class="comp">${esc(m.competition)}</span>
        <span class="status">${esc(m.status)}</span>
      </div>
      <div class="teams">
        <div class="team">
          <div class="crest">${esc(initials(m.home))}</div>
          <div class="team-name">${esc(m.home)}</div>
        </div>
        <div class="team">
          <div class="crest">${esc(initials(m.away))}</div>
          <div class="team-name">${esc(m.away)}</div>
        </div>
      </div>
      <div class="score">${esc(m.score || (m.status==="Finalizado" ? "Final" : "VS"))}</div>
      <div class="card-bottom">
        <span>${esc(m.time || "Horario pendiente")}</span>
        <span>VER FICHA →</span>
      </div>
    </article>
  `).join("");
}

function showSport(sport){
  currentSport=sport;
  document.querySelectorAll(".tab").forEach(b=>
    b.classList.toggle("active",b.dataset.sport===sport)
  );
  closeDetail();
  render();
}

function setFilter(filter){
  currentFilter=filter;
  document.querySelectorAll(".filter").forEach(b=>
    b.classList.toggle("active",b.dataset.filter===filter)
  );
  render();
}

document.querySelectorAll(".tab").forEach(b=>
  b.addEventListener("click",()=>showSport(b.dataset.sport))
);
document.querySelectorAll(".filter").forEach(b=>
  b.addEventListener("click",()=>setFilter(b.dataset.filter))
);

function statsHTML(m){
  let rows="";
  if(m.stats && typeof m.stats==="object" && !Array.isArray(m.stats)){
    rows=Object.entries(m.stats).map(([k,v])=>`
      <tr><td>${esc(k)}</td><td colspan="2">${esc(v)}</td></tr>
    `).join("");
  }

  if(!rows && !m.statsText){
    return '<p style="color:var(--muted);font-size:13px">Todavía no hay estadísticas registradas para este partido.</p>';
  }

  return `
    ${rows ? `<table class="stat-table"><tbody>${rows}</tbody></table>` : ""}
    ${m.statsText ? `<div style="white-space:pre-wrap;line-height:1.7;font-size:13px;margin-top:12px">${esc(m.statsText)}</div>` : ""}
  `;
}

function openDetail(id){
  const m=matches.find(x=>x.id===id);
  if(!m)return;

  document.getElementById("home").classList.add("hidden");
  document.getElementById("detail").classList.remove("hidden");

  document.getElementById("detailContent").innerHTML=`
    <div class="panel">
      <div class="detail-header">
        <div class="comp">${esc(m.competition)}</div>
        <div class="status" style="margin-top:10px">${esc(m.status)}</div>
        <div class="detail-teams">
          <div class="detail-team">
            <div class="crest">${esc(initials(m.home))}</div>
            <div style="margin-top:10px">${esc(m.home)}</div>
          </div>
          <div class="detail-team">
            <div class="crest">${esc(initials(m.away))}</div>
            <div style="margin-top:10px">${esc(m.away)}</div>
          </div>
        </div>
        <div class="detail-score">${esc(m.score || "VS")}</div>
        <div class="detail-time">${esc(m.time || "Horario pendiente")}</div>
      </div>
    </div>

    <div class="panel detail-section">
      <h3>ESTADÍSTICAS DEL PARTIDO</h3>
      ${statsHTML(m)}
    </div>

    <div class="panel detail-section">
      <h3>INFORMACIÓN DEL ENCUENTRO</h3>
      <div class="info-line"><span>Deporte</span><strong>${esc(m.sport)}</strong></div>
      <div class="info-line"><span>Competición</span><strong>${esc(m.competition)}</strong></div>
      <div class="info-line"><span>Estado</span><strong>${esc(m.status)}</strong></div>
    </div>

    <button class="primary" onclick="editFromDetail('${m.id}')">EDITAR ESTADÍSTICAS</button>
  `;
  window.scrollTo(0,0);
}

function closeDetail(){
  document.getElementById("detail").classList.add("hidden");
  document.getElementById("home").classList.remove("hidden");
  render();
}

function addMatch(){
  const home=document.getElementById("newHome").value.trim();
  const away=document.getElementById("newAway").value.trim();
  if(!home || !away){
    alert("Escribe los dos equipos o jugadores.");
    return;
  }

  matches.unshift(normalizeMatch({
    sport:document.getElementById("newSport").value,
    home,away,
    competition:document.getElementById("newCompetition").value || "Sin competición",
    time:document.getElementById("newTime").value,
    status:document.getElementById("newStatus").value
  }));

  save();
  render();
  refreshEditor();
  alert("Partido guardado correctamente.");
  ["newHome","newAway","newCompetition","newTime"].forEach(id=>
    document.getElementById(id).value=""
  );
}

function loadJSON(){
  try{
    const data=JSON.parse(document.getElementById("jsonInput").value);
    if(!Array.isArray(data)) throw new Error("El contenido debe ser una lista.");
    const valid=data.filter(m=>m && m.home && m.away);
    if(!valid.length) throw new Error("No encontré partidos válidos.");
    matches.push(...valid.map(normalizeMatch));
    save();
    render();
    refreshEditor();
    document.getElementById("jsonInput").value="";
    alert("¡Cargados "+valid.length+" partidos correctamente!");
  }catch(e){
    alert("Error en los datos: "+e.message);
  }
}

function refreshEditor(){
  const select=document.getElementById("editMatch");
  select.innerHTML=matches.map(m=>
    `<option value="${esc(m.id)}">${esc(m.home)} vs ${esc(m.away)} (${esc(m.sport)})</option>`
  ).join("");
  loadEditor();
}

function loadEditor(){
  const m=matches.find(x=>x.id===document.getElementById("editMatch").value);
  if(!m)return;
  document.getElementById("editScore").value=m.score || "";
  document.getElementById("editStatus").value=m.status || "Próximo";
  let text=m.statsText || "";
  if(m.stats && typeof m.stats==="object" && Object.keys(m.stats).length){
    text+=Object.entries(m.stats).map(([k,v])=>k+": "+v).join("\n");
  }
  document.getElementById("editStats").value=text;
}

function saveEditor(){
  const m=matches.find(x=>x.id===document.getElementById("editMatch").value);
  if(!m){alert("Selecciona un partido.");return;}
  m.score=document.getElementById("editScore").value;
  m.status=document.getElementById("editStatus").value;
  m.statsText=document.getElementById("editStats").value;
  m.stats={};
  save();
  render();
  alert("Cambios guardados.");
}

function deleteMatch(){
  const id=document.getElementById("editMatch").value;
  const m=matches.find(x=>x.id===id);
  if(!m)return;
  if(!confirm("¿Seguro que quieres eliminar "+m.home+" vs "+m.away+"?"))return;
  matches=matches.filter(x=>x.id!==id);
  save();
  render();
  refreshEditor();
  alert("Partido eliminado.");
}

function editFromDetail(id){
  closeDetail();
  toggleAdmin(true);
  document.getElementById("editMatch").value=id;
  loadEditor();
  document.getElementById("admin").scrollIntoView();
}

function toggleAdmin(force){
  const admin=document.getElementById("admin");
  const open=force===true || admin.classList.contains("hidden");
  admin.classList.toggle("hidden",!open);
  if(open)refreshEditor();
  if(open)admin.scrollIntoView({behavior:"smooth"});
}

function exportData(){
  const blob=new Blob([JSON.stringify(matches,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;a.download="analisisbetchile-respaldo.json";a.click();
  URL.revokeObjectURL(url);
}

function importData(){
  const file=document.getElementById("importFile").files[0];
  if(!file){alert("Selecciona un archivo JSON.");return;}
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const data=JSON.parse(reader.result);
      if(!Array.isArray(data))throw new Error("El archivo no contiene una lista.");
      if(!confirm("Esto reemplazará los partidos actuales. ¿Continuar?"))return;
      matches=data.map(normalizeMatch);
      save();render();refreshEditor();
      alert("Respaldo importado correctamente.");
    }catch(e){alert("No se pudo importar: "+e.message);}
  };
  reader.readAsText(file);
}

render();
refreshEditor();
</script>
</body>
</html>
